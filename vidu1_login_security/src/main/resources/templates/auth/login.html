<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập - Ví dụ 1')}"></head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Đăng nhập (Ví dụ 1)</h2>
    <p style="color: #64748b; font-size: 14px;">Spring Security 7 + Spring Boot 4 + MapStruct (Layout không dùng Dialect)</p>
    
    <div class="alert error" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div>
    <div class="alert success" th:if="${param.logout}">Bạn đã đăng xuất thành công.</div>

    <form th:action="@{/login}" method="post">
        <label>Email đăng nhập</label>
        <input type="email" name="email" value="trungnh@hcmute.edu.vn" required autofocus>
        
        <label>Mật khẩu</label>
        <input type="password" name="password" value="123456" required>
        
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        
        <div style="margin-top: 20px;">
            <button class="btn primary full" type="submit">Đăng nhập</button>
        </div>
    </form>
    <div style="margin-top: 15px; font-size: 13px; color: #64748b;">
        <p>Tài khoản mẫu:</p>
        <ul>
            <li>Admin: <code>trungnh@hcmute.edu.vn</code> / pass: <code>123456</code></li>
            <li>User: <code>user@hcmute.edu.vn</code> / pass: <code>123456</code></li>
        </ul>
        <a th:href="@{/}">← Về trang chủ</a>
    </div>
</div>
</body>
</html>
