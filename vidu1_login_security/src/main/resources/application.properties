spring.application.name=vidu1_login_security
server.port=${SERVER_PORT:8081}

# Database configuration (Defaults to local file H2 for smooth offline execution, configurable to SQL Server via environment or .env)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/webst4;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

spring.main.allow-bean-definition-overriding=true
