<!DOCTYPE html>
<html lang="vi"

      layout:decorate="~{layouts/layout}">
<head>
    <title>Admin Dashboard</title>
</head>
<body>
<main layout:fragment="content">

        <h1 style="color: #dc2626;">Khu Vực Quản Trị Hệ Thống (Ví dụ 2)</h1>

        <p>Quản trị viên đang đăng nhập: <strong th:text="${#authentication.principal.fullName}">Admin</strong></p>
        <div style="margin-top: 20px;">
            <a th:href="@{/}" class="btn primary">Về trang chủ</a>
        </div>
    </div>
