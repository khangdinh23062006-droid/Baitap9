<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar">
    <nav style="display: flex; align-items: center; width: 100%;">
        <div class="brand">
            <a th:href="@{/}">UTEShop</a>
        </div>
        
        <div style="margin-left: 30px; display: flex; gap: 15px;">
            <a th:href="@{/}">Trang chủ</a>
            <a th:if="${#authorization.expression('hasRole(\'ROLE_ADMIN\')')}" th:href="@{/admin/dashboard}">Admin</a>
        </div>

        <div th:if="${#authorization.expression('isAuthenticated()')}" class="account">
            <!-- Avatar -->
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
                 alt="Avatar" width="40" height="40"
                 style="border-radius: 50%; object-fit: cover; border: 2px solid #93c5fd;">

            <!-- Full name -->
            <span style="font-weight: 600;" th:text="${#authentication.principal.fullName}">Nguyễn Hữu Trung</span>

            <!-- Username -->
            <span style="color: #93c5fd;" th:text="'(' + ${#authentication.principal.username} + ')'">(user01)</span>

            <!-- Role badge -->
            <span style="background: #2563eb; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 12px;"
                  th:text="${#authentication.principal.role}">ROLE_USER</span>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post" style="display: inline; margin-left: 10px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="link-button">Đăng xuất</button>
            </form>
        </div>

        <div th:unless="${#authorization.expression('isAuthenticated()')}" class="account">
            <a th:href="@{/login}" class="link-button">Đăng nhập</a>
        </div>
    </nav>
</header>
</body>
</html>
