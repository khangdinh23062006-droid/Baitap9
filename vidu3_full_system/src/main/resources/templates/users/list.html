<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý người dùng</title>
</head>
<body>
<main layout:fragment="content">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1 style="margin: 0;">Quản lý Người Dùng</h1>
                <p style="color: #64748b; margin: 5px 0 0;">Tổng số: <strong th:text="${totalUsers}"></strong> người dùng</p>
            </div>
            <a th:href="@{/users/new}" class="btn primary">+ Thêm người dùng mới</a>
        </div>

        <!-- Search box -->
        <form th:action="@{/users}" method="get" style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm theo username, họ tên hoặc email..." class="form-control" style="flex: 1;">
            <button type="submit" class="btn primary">Tìm kiếm</button>
            <a th:if="${keyword != ''}" th:href="@{/users}" class="btn secondary">Đặt lại</a>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Avatar</th>
                    <th>Username</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Vai trò</th>
                    <th>Số sản phẩm</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users.content}">
                    <td th:text="${u.id}"></td>
                    <td>
                        <img th:src="${u.images != null and !#strings.isEmpty(u.images) ? u.images : '/images/avatar-default.png'}"
                             style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover;">
                    </td>
                    <td><strong th:text="${u.username}"></strong></td>
                    <td th:text="${u.fullName}"></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span th:class="'badge ' + (${u.roleName == 'ROLE_ADMIN'} ? 'admin' : 'user')" th:text="${u.roleName}"></span>
                    </td>
                    <td>
                        <span style="font-weight: 600;" th:text="${u.productCount}">0</span> sản phẩm
                    </td>
                    <td>
                        <a th:href="@{/users/toggle/{id}(id=${u.id})}"
                           th:class="'badge ' + (${u.enabled} ? 'active' : 'inactive')"
                           style="text-decoration: none;"
                           title="Bấm để đổi trạng thái"
                           th:text="${u.enabled ? 'Đã kích hoạt' : 'Khóa'}"></a>
                    </td>
                    <td>
                        <a th:href="@{/users/edit/{id}(id=${u.id})}" class="btn secondary small">Sửa</a>
                        <a th:href="@{/users/delete/{id}(id=${u.id})}" class="btn danger small"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa người dùng này?');">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${users.totalElements == 0}">
                    <td colspan="9" style="text-align: center; color: #64748b; padding: 25px;">Không tìm thấy người dùng nào phù hợp.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${users.totalPages > 1}">
            <a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number - 1}, keyword=${keyword})}">« Trước</a>
            <span th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
                <a th:href="@{/users(page=${i}, keyword=${keyword})}"
                   th:class="${i == users.number ? 'active' : ''}" th:text="${i + 1}"></a>
            </span>
            <a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number + 1}, keyword=${keyword})}">Sau »</a>
        </div>
    </div>
</main>
</body>
</html>
