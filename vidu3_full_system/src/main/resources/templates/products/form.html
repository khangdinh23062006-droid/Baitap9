<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${productDTO.id != null ? 'Chỉnh sửa sản phẩm' : 'Đăng sản phẩm mới'}">Sản phẩm</title>
</head>
<body>
<main layout:fragment="content">
    <div class="card" style="max-width: 700px; margin: 0 auto;">
        <h1 th:text="${productDTO.id != null ? 'Chỉnh Sửa Sản Phẩm' : 'Đăng Bán Sản Phẩm Mới'}"></h1>

        <form th:action="@{/products/save}" th:object="${productDTO}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">

            <div style="margin-bottom: 15px;">
                <label>Tên sản phẩm *</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Bàn phím cơ không dây" required>
                <div style="color: red; font-size: 12px;" th:errors="*{name}"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <div>
                    <label>Hãng sản xuất</label>
                    <input type="text" th:field="*{brand}" class="form-control" placeholder="VD: Logitech">
                </div>
                <div>
                    <label>Nơi xuất xứ</label>
                    <input type="text" th:field="*{madein}" class="form-control" placeholder="VD: Nhật Bản">
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <label>Giá bán (VNĐ) *</label>
                <input type="number" step="1000" th:field="*{price}" class="form-control" placeholder="VD: 1500000" required>
                <div style="color: red; font-size: 12px;" th:errors="*{price}"></div>
            </div>

            <div style="margin-bottom: 15px;">
                <label>Ảnh sản phẩm (Upload lên Cloudinary hoặc Lưu trữ cục bộ)</label>
                <input type="file" name="imageFile" class="form-control" accept="image/*">
                <div th:if="${productDTO.images != null}" style="margin-top: 10px;">
                    <span style="font-size: 13px; color: #64748b;">Ảnh hiện tại:</span><br>
                    <img th:src="${productDTO.images}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px; margin-top: 5px;">
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label>Mô tả chi tiết</label>
                <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Mô tả thông tin chi tiết về sản phẩm..."></textarea>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn primary">Lưu sản phẩm</button>
                <a th:href="@{/products}" class="btn secondary">Hủy bỏ</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
