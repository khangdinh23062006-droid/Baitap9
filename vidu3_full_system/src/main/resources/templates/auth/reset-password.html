<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - UTEShop Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>Đặt lại mật khẩu</h1>
    <h2>Xác thực OTP &amp; Đổi mật khẩu</h2>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <div>
            <label>Email</label>
            <input type="email" th:field="*{email}" readonly style="background: #f1f5f9;">
        </div>

        <div>
            <label>Mã OTP (6 chữ số)</label>
            <input type="text" th:field="*{otpCode}" placeholder="Nhập mã OTP nhận qua mail" maxlength="6" required autofocus>
            <div style="color: red; font-size: 12px;" th:errors="*{otpCode}"></div>
        </div>

        <div>
            <label>Mật khẩu mới</label>
            <input type="password" th:field="*{newPassword}" placeholder="Tối thiểu 6 ký tự" required>
            <div style="color: red; font-size: 12px;" th:errors="*{newPassword}"></div>
        </div>

        <div>
            <label>Xác nhận mật khẩu mới</label>
            <input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới" required>
            <div style="color: red; font-size: 12px;" th:errors="*{confirmPassword}"></div>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div style="margin-top: 22px;">
            <button class="btn primary full" type="submit">Cập nhật mật khẩu mới</button>
        </div>
    </form>

    <div style="margin-top: 20px; text-align: center;">
        <a th:href="@{/login}" style="color: #64748b; text-decoration: none; font-size: 14px;">← Về trang đăng nhập</a>
    </div>
</div>
</body>
</html>
