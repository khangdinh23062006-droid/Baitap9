<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận mã OTP - UTEShop Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>Xác thực tài khoản</h1>
    <h2>Nhập mã OTP</h2>
    <p style="color: #64748b; font-size: 14px;">
        Mã OTP 6 chữ số đã được gửi qua email. Vui lòng kiểm tra hộp thư đến (hoặc kiểm tra log server nếu đang chạy offline).
    </p>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <div>
            <label>Địa chỉ Email</label>
            <input type="email" th:field="*{email}" readonly style="background: #f1f5f9;">
        </div>

        <div>
            <label>Mã OTP (6 chữ số)</label>
            <input type="text" th:field="*{otpCode}" placeholder="Nhập 6 chữ số OTP" maxlength="6" required autofocus
                   style="font-size: 20px; letter-spacing: 4px; text-align: center;">
            <div style="color: red; font-size: 12px;" th:errors="*{otpCode}"></div>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div style="margin-top: 22px;">
            <button class="btn primary full" type="submit">Kích hoạt tài khoản</button>
        </div>
    </form>

    <form th:action="@{/register/resend-otp}" method="post" style="margin-top: 15px; text-align: center;">
        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
        <input type="hidden" name="type" value="REGISTER">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" style="background: none; border: none; color: #0284c7; cursor: pointer; text-decoration: underline;">
            Chưa nhận được mã? Gửi lại OTP
        </button>
    </form>

    <div style="margin-top: 20px; text-align: center;">
        <a th:href="@{/login}" style="color: #64748b; text-decoration: none; font-size: 14px;">← Về trang đăng nhập</a>
    </div>
</div>
</body>
</html>
