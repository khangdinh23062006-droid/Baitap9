<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - UTEShop Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>Quên mật khẩu</h1>
    <h2>Lấy lại mật khẩu</h2>
    <p style="color: #64748b; font-size: 14px;">
        Nhập địa chỉ email đăng ký để nhận mã OTP khôi phục mật khẩu.
    </p>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <div>
            <label>Địa chỉ Email</label>
            <input type="email" th:field="*{email}" placeholder="Nhập email của bạn" required autofocus>
            <div style="color: red; font-size: 12px;" th:errors="*{email}"></div>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div style="margin-top: 22px;">
            <button class="btn primary full" type="submit">Gửi mã OTP qua Email</button>
        </div>
    </form>

    <div style="margin-top: 20px; text-align: center;">
        <a th:href="@{/login}" style="color: #0284c7; text-decoration: none; font-size: 14px;">← Quay lại đăng nhập</a>
    </div>
</div>
</body>
</html>
