<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản - UTEShop Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>UTEShop Pro</h1>
    <h2>Đăng ký tài khoản</h2>
    <p style="color: #64748b; font-size: 13px;">Đăng ký và xác thực qua mã OTP được gửi đến Gmail</p>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" th:object="${registerDTO}" method="post" enctype="multipart/form-data">
        <div>
            <label>Tên đăng nhập (Username)</label>
            <input type="text" th:field="*{username}" placeholder="VD: nguyenan" required>
            <div style="color: red; font-size: 12px;" th:errors="*{username}"></div>
        </div>

        <div>
            <label>Họ và tên</label>
            <input type="text" th:field="*{fullName}" placeholder="VD: Nguyễn Văn An" required>
            <div style="color: red; font-size: 12px;" th:errors="*{fullName}"></div>
        </div>

        <div>
            <label>Địa chỉ Email (Nhận mã OTP)</label>
            <input type="email" th:field="*{email}" placeholder="VD: an@gmail.com" required>
            <div style="color: red; font-size: 12px;" th:errors="*{email}"></div>
        </div>

        <div>
            <label>Ảnh đại diện (Avatar - Tùy chọn)</label>
            <input type="file" name="avatarFile" accept="image/*">
        </div>

        <div>
            <label>Mật khẩu</label>
            <input type="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự" required>
            <div style="color: red; font-size: 12px;" th:errors="*{password}"></div>
        </div>

        <div>
            <label>Xác nhận mật khẩu</label>
            <input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu" required>
            <div style="color: red; font-size: 12px;" th:errors="*{confirmPassword}"></div>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div style="margin-top: 22px;">
            <button class="btn primary full" type="submit">Đăng ký &amp; Nhận OTP</button>
        </div>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 14px;">
        <span>Đã có tài khoản? </span>
        <a th:href="@{/login}" style="color: #0284c7; text-decoration: none; font-weight: 600;">Đăng nhập ngay</a>
    </div>
</div>
</body>
</html>
