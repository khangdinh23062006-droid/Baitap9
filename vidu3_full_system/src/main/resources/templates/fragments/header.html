<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">UTEShop Pro</a>
    </div>
    
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/products}">Sản phẩm</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/my-products}">Sản phẩm của tôi</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}">Quản lý Users</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}">Admin Dashboard</a>
    </nav>

    <div class="account" sec:authorize="isAuthenticated()">
        <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
             alt="Avatar" class="avatar">
        <div>
            <div style="font-weight: 600; font-size: 14px;" th:text="${#authentication.principal.fullName}">User</div>
            <div style="font-size: 12px; color: #94a3b8;">
                <span th:text="'(' + ${#authentication.principal.username} + ')'"></span> · 
                <span style="color: #38bdf8;" th:text="${#authentication.principal.role}"></span>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 10px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>

    <div class="account" sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}" class="link-button">Đăng nhập</a>
        <a th:href="@{/register}" class="btn primary small" style="margin-left: 10px;">Đăng ký</a>
    </div>
</header>
</body>
</html>
